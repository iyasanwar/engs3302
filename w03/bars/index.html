<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowding and Area</title>
<style>
/* A 16:9 stage (1600 x 900 design units) scaled to fit any window or slide frame, so nothing is cut and text scales with the slide. */
:root{--bg:#ffffff;--panel:#f6f7f9;--ink:#1b2130;--muted:#5c6577;--line:#dfe3ea;--bar:#b9bec8;--bass:#2d5bc4;--salmon:#d9822b;--accent:#2d5bc4;
  --f-ui:"Segoe UI","Helvetica Neue",Arial,system-ui,sans-serif;--f-num:ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;--f-body:"Palatino Linotype",Palatino,Georgia,serif}

:root[data-theme="dark"]{--bg:#12151c;--panel:#1a1f29;--ink:#e7eaf0;--muted:#9aa3b3;--line:#2b3240;--bar:#5b6372;--bass:#7ea3f2;--salmon:#f0a65c;--accent:#7ea3f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#fit{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;flex:none;transform-origin:center center;display:grid;grid-template-columns:1010px 1fr;grid-template-rows:auto 1fr auto auto;gap:14px 26px;padding:24px 36px 14px}
header{grid-column:1/-1;display:flex;align-items:center;gap:22px;flex-wrap:nowrap}
h1{margin:0;font-family:var(--f-body);font-size:40px;font-weight:700;white-space:nowrap}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.seg button{border:none;background:transparent;font:inherit;font-size:22px;color:var(--ink);padding:8px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.sp{flex:1}
.chart{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-rows:1fr auto;min-height:0}
canvas{width:100%;height:100%;display:block;min-height:0}
.verdict{margin:6px 6px 2px;font-family:var(--f-body);font-size:25px;line-height:1.3;border-left:6px solid var(--accent);padding:4px 0 4px 14px;min-height:72px}
.side{display:grid;gap:14px;align-content:start;min-height:0}
.card{border:3px solid var(--line);border-radius:14px;padding:12px 16px;background:var(--bg);display:grid;gap:6px}
.card h3{margin:0;font-size:22px;letter-spacing:.02em}
.row{display:flex;justify-content:space-between;gap:12px;font-size:22px;border-top:1px dashed var(--line);padding-top:5px}
.row:first-of-type{border-top:none}
.row b{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-family:var(--f-num);font-size:21px;text-align:right}
th{font-family:var(--f-ui);font-size:18px;color:var(--muted);font-weight:600;padding-bottom:4px}
td{padding:2px 4px}
tr.cur td{color:var(--accent);font-weight:700}
footer{grid-column:1/-1;display:grid;gap:6px}
.ctl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;font-size:22px;flex:1}
.ctl output{font-family:var(--f-num);min-width:96px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.grp{display:flex;gap:22px;align-items:center}
.lab{font-weight:700;font-size:24px;white-space:nowrap;width:64px;flex:none}
.chk{display:flex;align-items:center;gap:6px;font-size:24px;white-space:nowrap;width:64px;flex:none}
.chk input{width:24px;height:24px}
.src{grid-column:1/-1;font-size:16px;color:var(--muted);text-align:right;margin:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>

  c.fillStyle=css("--muted");c.font="20px "+css("--f-ui");
  for(let v=170;v<=235;v+=5){c.textAlign="center";c.fillText(v,X(v),H-pad.b+26);}
  const st0=Math.pow(10,Math.floor(Math.log10(ym/4))),st=[1,2,5,10].map(m=>m*st0).find(m=>ym/m<=5);
  for(let v=0;v<=ym+1e-12;v+=st){c.textAlign="right";c.fillText(+v.toPrecision(4),pad.l-10,Y(v)+7);}
  c.textAlign="center";c.fillText("flipper length (mm)",(pad.l+W-pad.r)/2,H-8);
  c.save();c.translate(22,(pad.t+H-pad.b)/2);c.rotate(-Math.PI/2);c.fillText(den?`fraction per ${P.u===1?"mm":"m"}`:`penguins per ${P.u===1?"mm":"m"}`,0,0);c.restore();
}
function seg(ids,fn){ids.forEach((id,i)=>$(id).onclick=()=>{fn(i);ids.forEach(j=>$(j).setAttribute("aria-pressed",j===id));render();});}
seg(["m-two","m-shrink"],i=>P.mode=i?"shrink":"two"); seg(["y-cnt","y-den"],i=>P.y=i?"den":"cnt"); seg(["v-mm","v-m"],i=>P.u=i?2:1);
["a1","b1","a2","b2"].forEach(id=>$(id).oninput=e=>{P[id]=+e.target.value;render();});
$("c3").oninput=e=>{P.c=+e.target.value;render();}; $("w3").oninput=e=>{P.wi=+e.target.value;render();};
$("useB").onchange=e=>{P.useB=e.target.checked;render();};
window.__p=P; window.__render=render;
addEventListener("resize",()=>{fit();render();}); fit(); render();
})();
